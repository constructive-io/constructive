"""Methods to use when ordering `Note`."""
enum NoteOrderBy {
  NATURAL
  PRIMARY_KEY_ASC
  PRIMARY_KEY_DESC
  ID_ASC
  ID_DESC
  TITLE_ASC
  TITLE_DESC
}

type Subscription {
  """
  Subscribe to changes on this table. Pass ids to watch specific rows, or no args for the full collection.
  """
  onNoteChanged(ids: [UUID!]): NoteSubscriptionPayload
}

"""Payload delivered when a Note row changes."""
type NoteSubscriptionPayload {
  """The DML operation: INSERT, UPDATE, DELETE, or INVALIDATE."""
  event: String!

  """
  The current state of the row (null for DELETE, INVALIDATE, or if RLS denies access).
  """
  note: Note

  """
  The ID of the changed row (null for INVALIDATE, or masked when RLS denies access).
  """
  rowId: UUID

  """True when too many changes occurred and the client should refetch."""
  overflow: Boolean!
}
