# Captured from the real routed server with RealtimeSubscriptionsPreset; reduced to notes and its subscription.
type Query {
  """Reads and enables pagination through a set of `Note`."""
  notes(
    """Only read the first `n` values of the set."""
    first: Int

    """Only read the last `n` values of the set."""
    last: Int

    """
    Skip the first `n` values from our `after` cursor, an alternative to cursor
    based pagination. May not be used with `last`.
    """
    offset: Int

    """Read all values in the set before (above) this cursor."""
    before: Cursor

    """Read all values in the set after (below) this cursor."""
    after: Cursor

    """
    A filter to be used in determining which values should be returned by the collection.
    """
    where: NoteFilter

    """The method to use when ordering `Note`."""
    orderBy: [NoteOrderBy!] = [PRIMARY_KEY_ASC]
  ): NoteConnection
}

"""A connection to a list of `Note` values."""
type NoteConnection {
  """A list of `Note` objects."""
  nodes: [Note]!

  """
  A list of edges which contains the `Note` and cursor to aid in pagination.
  """
  edges: [NoteEdge]!

  """Information to aid in pagination."""
  pageInfo: PageInfo!

  """The count of *all* `Note` you could get from the connection."""
  totalCount: Int!
}

type Note {
  id: UUID!
  title: String!
}

"""
A universally unique identifier as defined by [RFC 4122](https://tools.ietf.org/html/rfc4122).
"""
scalar UUID

"""A `Note` edge in the connection."""
type NoteEdge {
  """A cursor for use in pagination."""
  cursor: Cursor

  """The `Note` at the end of the edge."""
  node: Note
}

"""A location in a connection that can be used for resuming pagination."""
scalar Cursor

"""Information about pagination in a connection."""
type PageInfo {
  """When paginating forwards, are there more items?"""
  hasNextPage: Boolean!

  """When paginating backwards, are there more items?"""
  hasPreviousPage: Boolean!

  """When paginating backwards, the cursor to continue."""
  startCursor: Cursor

  """When paginating forwards, the cursor to continue."""
  endCursor: Cursor
}

"""
A filter to be used against `Note` object types. All fields are combined with a logical ‘and.’
"""
input NoteFilter {
  """Filter by the object’s `id` field."""
  id: UUIDFilter

  """Filter by the object’s `title` field."""
  title: StringFilter

  """Checks for all expressions in this list."""
  and: [NoteFilter!]

  """Checks for any expressions in this list."""
  or: [NoteFilter!]

  """Negates the expression."""
  not: NoteFilter
}

