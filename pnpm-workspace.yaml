packages:
  - 'packages/*'
  - 'pgpm/*'
  - 'graphql/*'
  - 'sdk/*'
  - 'examples/*'
  - 'uploads/*'
  - 'postgres/*'
  - 'graphile/*'
  - 'agentic/*'

# Managed by pnpm-policy — run `pnpm-policy generate` after editing pnpm-policy.yaml.

# A third-party release must be 2w old before it can be installed.
# Most malicious releases are found and yanked well inside that window.
minimumReleaseAge: 20160

# Exempt from the wait: 6 scope glob(s), 49 first-party package(s), 9 exception(s).
# First-party membership comes from what pyramation, benjie publish on npm — waiting on your own release protects nothing.
minimumReleaseAgeExclude:
  - "@constructive-db/*"
  - "@constructive-io/*"
  - "@launchql/*"
  - "@pgpm/*"
  - "@pgpmjs/*"
  - "@pgsql/*"
  - "@dataplan/json"
  - "@dataplan/pg"
  - "@decryption/hashes"
  - "@graphile-contrib/pg-many-to-many"
  - "@graphile/lru"
  - "@graphiql/plugin-doc-explorer"
  - "@graphiql/plugin-history"
  - "@graphiql/react"
  - "@graphiql/toolkit"
  - "@inquirerer/test"
  - "@inquirerer/utils"
  - appstash
  - clean-ansi
  - confstash
  - find-and-require-package-json
  - genomic
  - git-changed
  - grafast
  - grafserv
  - graphile-build
  - graphile-build-pg
  - graphile-config
  - graphile-utils
  - graphiql
  - graphql
  - graphql-language-service
  - inflekt
  - inquirerer
  - komoji
  - libpg-query
  - makage
  - monaco-graphql
  - nested-obj
  - pg-introspection
  - pg-proto-parser
  - pg-sql2
  - pgsql-deparser
  - pgsql-parser
  - plpgsql-deparser
  - plpgsql-parser
  - pnpm-policy
  - postgraphile
  - ruru
  - ruru-types
  - schema-typescript
  - strfy-js
  - tamedevil
  - yamlize
  - yanse
  - "@typescript-eslint/eslint-plugin@8.66.0" # ^8.66.0 floor matches the newest release; nothing older satisfies it (expires 2026-08-17)
  - "@typescript-eslint/parser@8.66.0" # ^8.66.0 floor matches the newest release; nothing older satisfies it (expires 2026-08-17)
  - "@playwright/test@1.62.1" # ^1.62.1 floor matches the newest release; nothing older satisfies it (expires 2026-08-13)
  - "@types/pg@8.20.4" # ^8.20.4 floor matches the newest release; nothing older satisfies it (expires 2026-08-18)
