packages:
  - 'packages/*'
  - 'pgpm/*'
  - 'graphql/*'
  - 'sdk/*'
  - 'examples/*'
  - 'uploads/*'
  - 'postgres/*'
  - 'graphile/*'
  - 'agentic/*'

# Managed by pnpm-policy — run `pnpm-policy generate` after editing pnpm-policy.yaml.

# A third-party release must be 2d old before it can be installed.
# Most malicious releases are found and yanked well inside that window.
minimumReleaseAge: 2880

# Exempt from the wait: 6 scope glob(s), 41 first-party package(s), 7 exception(s).
# First-party membership comes from the inventory.
minimumReleaseAgeExclude:
  - "@constructive-db/*"
  - "@constructive-io/*"
  - "@launchql/*"
  - "@pgpm/*"
  - "@pgpmjs/*"
  - "@pgsql/*"
  - "@dataplan/json"
  - "@dataplan/pg"
  - "@decryption/hashes"
  - "@graphile-contrib/pg-many-to-many"
  - "@graphile/lru"
  - "@inquirerer/test"
  - "@inquirerer/utils"
  - appstash
  - clean-ansi
  - confstash
  - find-and-require-package-json
  - genomic
  - git-changed
  - grafast
  - grafserv
  - graphile-build
  - graphile-build-pg
  - graphile-config
  - graphile-utils
  - inflekt
  - inquirerer
  - komoji
  - libpg-query
  - makage
  - nested-obj
  - pg-introspection
  - pg-proto-parser
  - pg-sql2
  - pgsql-deparser
  - pgsql-parser
  - plpgsql-deparser
  - plpgsql-parser
  - pnpm-policy
  - postgraphile
  - ruru
  - ruru-types
  - schema-typescript
  - strfy-js
  - tamedevil
  - yamlize
  - yanse
  - "@typescript-eslint/eslint-plugin@8.66.0" # ^8.66.0 floor matches the newest release; nothing older satisfies it (expires 2026-08-17)
  - "@typescript-eslint/parser@8.66.0" # ^8.66.0 floor matches the newest release; nothing older satisfies it (expires 2026-08-17)
  - "@playwright/test@1.62.1" # ^1.62.1 floor matches the newest release; nothing older satisfies it (expires 2026-08-13)
  - "@types/pg@8.20.4" # ^8.20.4 floor matches the newest release; nothing older satisfies it (expires 2026-08-18)
  - "@types/react@19.2.18" # ^19.2.18 floor matches the newest release; nothing older satisfies it (expires 2026-08-13)
  - "@types/react-dom@19.2.4" # ^19.2.4 floor matches the newest release; nothing older satisfies it (expires 2026-08-13)
  - "@types/semver@7.8.0" # ^7.8.0 floor matches the newest release; nothing older satisfies it (expires 2026-08-16)

# Off: transitive dependencies may resolve from git or a URL.
blockExoticSubdeps: false

# Moved from package.json `pnpm.*` — pnpm 11 no longer reads that field, and
# pnpm 10 already honours these keys here, so this works on both majors.

# The Graphile v5 stack is resolved as a set: grafast, graphile-build* and
# @dataplan/* must agree, and a second copy of graphql produces
# "Cannot use GraphQLSchema from another module or realm" at runtime.
overrides:
  grafast: 1.1.2
  grafserv: 1.0.1
  graphile-build: 5.1.1
  graphile-build-pg: 5.1.3
  graphile-config: 1.1.0
  graphile-utils: 5.0.3
  postgraphile: 5.1.4
  pg-sql2: 5.0.1
  pg-introspection: 1.0.1
  tamedevil: 0.1.1
  '@dataplan/pg': 1.1.1
  '@dataplan/json': 1.0.1
  '@graphile/lru': 5.0.0
  '@graphile-contrib/pg-many-to-many': 2.0.0-rc.2
  graphql: 16.13.0
  '@smithy/node-http-handler': <4.5.0

publicHoistPattern:
  - '@jest/test-sequencer'

packageExtensions:
  'jest-config@*':
    dependencies:
      '@jest/test-sequencer': ^29.7.0

patchedDependencies:
  '@dataplan/pg': patches/@dataplan__pg.patch
  graphile-build-pg: patches/graphile-build-pg.patch
  pg-introspection@1.0.1: patches/pg-introspection@1.0.1.patch

# The only dependencies permitted to run install scripts.
allowBuilds:
  "@launchql/protobufjs": true
  core-js-pure: true
