  - "@types/semver@7.8.0" # ^7.8.0 floor matches the newest release; nothing older satisfies it (expires 2026-08-16)
  - minimatch@10.2.6 # ^10.2.6 floor matches the newest release; nothing older satisfies it (expires 2026-08-10)
  - "@0no-co/graphql.web@1.3.3" # ^1.3.3 floor matches the newest release; nothing older satisfies it (expires 2026-08-10)

