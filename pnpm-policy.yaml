# Supply-chain policy for this workspace. The pnpm settings it produces live in
# pnpm-workspace.yaml under the `Managed by pnpm-policy` marker — edit this file,
# then run:
#
#   pnpm run policy
#
# `pnpm run policy:check` fails CI when the two drift apart.

# Third-party releases wait two days before we can install them. A compromised
# release is normally reported and yanked within hours, so a short wait catches it
# without stalling upgrades. Our own packages are exempt (see `inventory` below),
# so publishing does not lock us out of our own workspace.
minimumReleaseAge: 2d

# Off for now: turning it on rejects any transitive dependency resolved from git
# or a URL, which is a separate re-resolution to make deliberately rather than
# inside a policy rollout.
blockExoticSubdeps: false

# No `maintainers` here. That key exists to BUILD an inventory by querying npm,
# and this workspace consumes published ones instead (see `inventory`). Listing
# an account would also exempt everything that account will ever publish, which
# is how `graphql` ended up exempt: the account behind the graphile stack
# co-maintains it, along with graphiql and monaco-graphql.

# Scopes we own outright, emitted as `@scope/*`.
scopes:
  - "@constructive-io"
  - "@constructive-db"
  - "@launchql"
  - "@pgpm"
  - "@pgpmjs"
  - "@pgsql"

# Two published inventories, merged. Neither is checked in here: they are pinned
# packages, so a change to what skips the wait arrives as a version bump you can
# review, not as an edit to a 1000-line file in this repo.
#
#   pnpm-policy          our own packages, derived from what we publish
#   pnpm-policy-graphile the graphile packages we run, a reviewed allowlist
#
# The graphile list enumerates names on purpose. It was an account entry until it
# turned out to exempt `graphql` itself, which now waits like any other
# third-party dependency — we upgrade it rarely, so the wait costs nothing.
inventory:
  - "@constructive-io/pnpm-policy/inventory.json"
  - "@constructive-io/pnpm-policy-graphile/inventory.json"

# Exempt only the inventory names this workspace's lockfile actually resolves —
# the list should describe this repo, not the whole npm account. Scope globs are
# never intersected.
#
# The cost: adding one of our own packages this repo has never used is not in the
# lockfile, so it is not exempt, so the wait blocks the install that would add
# it. Run `pnpm run policy` and install again.
intersect: true

# Dependencies permitted to run install scripts. Empty is the status quo here:
# nothing in this workspace has ever been approved, so @google/genai, esbuild,
# nx, protobufjs and unrs-resolver install without their scripts and the build
# works. An install script is arbitrary code at install time, so each addition is
# a deliberate decision and the value is the reason.
allowBuilds:
  '@launchql/protobufjs': true
  core-js-pure: true

# Escape hatch for third-party packages that cannot wait — an urgent security
# release, typically. A reason is required, and `until` makes the waiver expire
# so `check` forces a re-justification instead of letting it become permanent:
#
#   exceptions:
#     - package: lodash
#       versions: ["4.17.21"]
#       reason: CVE-2021-23337 fix, published today
#       until: 2026-09-01
#
# Every entry below has one shape: the spec has no satisfying release old enough
# to install, so any re-resolution — `pnpm up`, or `pnpm install` after a
# package.json edit — fails with ERR_PNPM_NO_MATURE_MATCHING_VERSION even though
# the version is already in the lockfile. `until` is the day that version turns
# two weeks old, so `check` expires the waiver the moment it stops mattering.
#
# The graphile v5 stack is deliberately absent: it is exempt via the
# pnpm-policy-graphile inventory instead of by waivers that would need rewriting
# on every upgrade.
exceptions:
  # Toolchain floors caught up with the newest release, so the floor itself is
  # the only satisfying version.
  - package: "@typescript-eslint/eslint-plugin"
    versions: ["8.66.0"]
    reason: ^8.66.0 floor matches the newest release; nothing older satisfies it
    until: 2026-08-17
  - package: "@typescript-eslint/parser"
    versions: ["8.66.0"]
    reason: ^8.66.0 floor matches the newest release; nothing older satisfies it
    until: 2026-08-17
  - package: "@types/pg"
    versions: ["8.20.4"]
    reason: ^8.20.4 floor matches the newest release; nothing older satisfies it
    until: 2026-08-18
  - package: "@types/semver"
    versions: ["7.8.0"]
    reason: ^7.8.0 floor matches the newest release; nothing older satisfies it
    until: 2026-08-16
