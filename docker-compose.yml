services:
  postgres:
    container_name: postgres
    image: docker.io/constructiveio/postgres-plus:18
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    expose:
      - "5432"
    networks:
      - constructive-net

  minio:
    container_name: minio
    image: minio/minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    expose:
      - "9000"
      - "9001"
    command: server /data --console-address ":9001"
    networks:
      - constructive-net

  # RustFS is an alternative to the `minio` service above: same S3 API on 9000
  # and console on 9001, so the two cannot run together. Behind a profile:
  # `docker compose up postgres` keeps MinIO, `docker compose --profile rustfs
  # up postgres rustfs` swaps it in. Pair it with BUCKET_PROVIDER=rustfs.
  rustfs:
    container_name: rustfs
    image: rustfs/rustfs:latest
    profiles:
      - rustfs
    environment:
      - RUSTFS_ACCESS_KEY=minioadmin
      - RUSTFS_SECRET_KEY=minioadmin
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
      - RUSTFS_CONSOLE_ENABLE=true
    ports:
      - "9000:9000"
      - "9001:9001"
    expose:
      - "9000"
      - "9001"
    command: /data
    networks:
      - constructive-net

networks:
  constructive-net:
    name: constructive-net
